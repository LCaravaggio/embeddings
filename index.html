<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espacio Semántico</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f9;
        color: #1f2937;
    }

    header {
        background: white;
        border-bottom: 1px solid #e5e7eb;
        padding: 22px 40px;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
    }

    header p {
        margin: 6px 0 0;
        color: #6b7280;
        font-size: 14px;
    }

.container {
    display: flex;
    height: calc(100vh - 100px);
    padding: 25px 35px;
    gap: 30px;
    max-width: 1400px;
    margin: auto;
}

    /* PANEL LATERAL */

    .sidebar {
        width: 280px;
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        height: fit-content;
    }

    .sidebar h2 {
        margin-top: 0;
        font-size: 18px;
    }

    .sidebar p {
        font-size: 14px;
        color: #6b7280;
        line-height: 1.5;
    }

    .input-group {
        display: flex;
        margin-top: 20px;
    }

    input {
        width: 100%;
        padding: 11px;
        border: 1px solid #d1d5db;
        border-radius: 7px 0 0 7px;
        outline: none;
        font-size: 14px;
    }

    input:focus {
        border-color: #2563eb;
    }

    button {
        border: none;
        background: #2563eb;
        color: white;
        padding: 0 15px;
        border-radius: 0 7px 7px 0;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #1d4ed8;
    }

    .word-list {
        margin-top: 25px;
    }

    .word-list h3 {
        font-size: 14px;
        color: #6b7280;
        font-weight: 500;
    }

    .word-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 14px;
    }

    .delete-btn {
        background: transparent;
        color: #ef4444;
        font-size: 18px;
        padding: 0 5px;
    }

    .delete-btn:hover {
        background: transparent;
        color: #b91c1c;
    }


    /* GRAFICO */

.chart-container {
    flex: 1;
    background: white;
    border-radius: 12px;
    padding: 25px 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    min-width: 0;
}

    .chart-container h2 {
        margin-top: 0;
        font-size: 20px;
    }

.chart {
    position: relative;
    height: calc(100vh - 200px);
    min-height: 200px;
    max-height: 500px;

    margin: 25px 30px 15px 80px;

    border-left: 2px solid #374151;
    border-bottom: 2px solid #374151;

    background:
        linear-gradient(to right, #f3f4f6 1px, transparent 1px),
        linear-gradient(to bottom, #f3f4f6 1px, transparent 1px);

    background-size: 10% 10%;
    overflow: hidden;
}

    /* Etiquetas de ejes */

    .x-label {
        text-align: center;
        margin-top: 15px;
        font-weight: 600;
        font-size: 16px;
    }

    .y-label {
    position: absolute;
    left: -50px;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);

    font-weight: 600;
    font-size: 16px;
    white-space: nowrap;
}

    /* Flechas */

    .arrow-x {
        position: absolute;
        right: -9px;
        bottom: -7px;
        font-size: 20px;
    }

    .arrow-y {
        position: absolute;
        left: -8px;
        top: -14px;
        font-size: 20px;
    }

    /* PALABRAS */

    .word {
        position: absolute;
        padding: 12px 20px;
        background: white;
        border: 2px solid #2563eb;
        border-radius: 8px;
        color: #1e3a8a;
        font-weight: 600;
        cursor: grab;
        user-select: none;
        box-shadow: 0 4px 10px rgba(37,99,235,0.15);
        transition: box-shadow 0.2s, transform 0.2s;
    }

    .word:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 18px rgba(37,99,235,0.25);
    }

    .word:active {
        cursor: grabbing;
    }

    .instructions {
        margin-top: 20px;
        color: #6b7280;
        font-size: 13px;
        text-align: center;
    }

    @media (max-width: 900px) {

        .container {
            flex-direction: column;
            padding: 20px;
        }

        .sidebar {
            width: 100%;
        }

        .chart {
            height: 500px;
            margin-left: 60px;
        }

    }

</style>
</head>

<body>

<header>
    <h1>Espacio Semántico</h1>
    <p>Ubicá las palabras según la relación que consideres que tienen con cada dimensión.</p>
</header>


<div class="container">

    <!-- PANEL LATERAL -->

    <aside class="sidebar">

        <h2>Agregar palabras</h2>

        <p>
            Escribí una nueva palabra y luego ubicala en el gráfico.
        </p>

        <div class="input-group">
            <input
                type="text"
                id="newWord"
                placeholder="Nueva palabra..."
                maxlength="30"
            >

            <button onclick="addWord()">+</button>
        </div>


        <div class="word-list">

            <h3>Palabras</h3>

            <div id="wordList"></div>

        </div>

    </aside>



    <!-- GRAFICO -->

    <main class="chart-container">

        <h2>Mapa conceptual</h2>

        <div id="chart" class="chart">

    <div class="y-label">Tamaño</div>

    <div class="arrow-y">▲</div>
    <div class="arrow-x">▶</div>

</div>

            <div class="arrow-y">▲</div>
            <div class="arrow-x">▶</div>

        </div>

        <div class="x-label">
            Humanidad
        </div>

        <div class="instructions">
            Arrastrá las palabras para ubicarlas dentro del espacio.
        </div>

    </main>

</div>



<script>

    const chart = document.getElementById("chart");
    const wordList = document.getElementById("wordList");
    const input = document.getElementById("newWord");

    let words = [
        {
            text: "Perro",
            x: 30,
            y: 65
        },
        {
            text: "Gato",
            x: 55,
            y: 50
        },
        {
            text: "Rey",
            x: 75,
            y: 25
        }
    ];


    function renderWords() {

        chart.querySelectorAll(".word").forEach(el => el.remove());

        wordList.innerHTML = "";


        words.forEach((word, index) => {

            const element = document.createElement("div");

            element.className = "word";

            element.textContent = word.text;

            element.style.left = word.x + "%";
            element.style.top = word.y + "%";

            element.style.transform = "translate(-50%, -50%)";

            makeDraggable(element, index);

            chart.appendChild(element);


            const listItem = document.createElement("div");

            listItem.className = "word-item";

            listItem.innerHTML = `
                <span>${word.text}</span>

                <button
                    class="delete-btn"
                    onclick="deleteWord(${index})"
                >
                    ×
                </button>
            `;

            wordList.appendChild(listItem);

        });

    }



    function makeDraggable(element, index) {

        let isDragging = false;


        element.addEventListener("mousedown", function(e) {

            isDragging = true;

            document.body.style.userSelect = "none";

        });


        document.addEventListener("mousemove", function(e) {

            if (!isDragging) return;


            const rect = chart.getBoundingClientRect();


            let x = e.clientX - rect.left;

            let y = e.clientY - rect.top;


            x = Math.max(0, Math.min(x, rect.width));

            y = Math.max(0, Math.min(y, rect.height));


            const xPercent = (x / rect.width) * 100;

            const yPercent = (y / rect.height) * 100;


            words[index].x = xPercent;

            words[index].y = yPercent;


            element.style.left = xPercent + "%";

            element.style.top = yPercent + "%";

        });


        document.addEventListener("mouseup", function() {

            if (isDragging) {

                isDragging = false;

                document.body.style.userSelect = "";

            }

        });

    }



    function addWord() {

        const text = input.value.trim();


        if (text === "") return;


        words.push({
            text: text,
            x: 50,
            y: 50
        });


        input.value = "";


        renderWords();

    }



    function deleteWord(index) {

        words.splice(index, 1);

        renderWords();

    }



    input.addEventListener("keypress", function(e) {

        if (e.key === "Enter") {

            addWord();

        }

    });



    renderWords();

</script>

</body>
</html>
